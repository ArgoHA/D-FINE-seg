project_name: cityscapes # for wandb
exp_name: det_s # experiment name

exp: ${exp_name}_${now_dir}

model_name: s # model size (n, s, m, l, x)
task: detect # detect | segment (instance segmentation) | sem_seg (semantic segmentation)

train:
  ### Paths ###
  root: /home/argo/Desktop/Projects/cityscapes # project root with dataset and outputs
  pretrained_dataset: coco # coco, obj2coco
  # detect: dfine_${model_name}_${train.pretrained_dataset}.pt; sem_seg/segment: use dfine_seg_*
  pretrained_model_path: pretrained/dfine_${model_name}_${train.pretrained_dataset}.pt

  imagenet_backbone: False # research: init HGNetv2 from ImageNet stage1 weights
  coco_dataset: False # set True when annotations are in COCO JSON format (train/val/test)

  data_path: ${train.root}/data/dataset # path to dataset (images/, labels/, train.csv, val.csv)
  path_to_test_data: ${train.root}/data/test  # path to test set, used in infer script
  path_to_save: ${train.root}/output/models/${exp} # where to save output

  debug_img_path: ${train.root}/output/debug_images
  eval_preds_path: ${train.root}/output/eval_preds
  bench_img_path: ${train.root}/output/bench_imgs
  infer_path: ${train.root}/output/infer

  ### Configs ###
  use_wandb: True
  device: cuda
  label_to_name: # dataset's classes
    0: person
    1: rider
    2: car
    3: truck
    4: bus
    5: train
    6: motorcycle
    7: bicycle

  use_one_class: False

  # sem_seg only: masks live in <data_path>/labels/<stem>.png, 1 channel, pixel value = class id
  sem_seg:
    ignore_index: 255 # pixel value excluded from loss + mIoU (also used as aug mask fill)
    class_weights: null # optional per-class CE weights for imbalance

  ### Distributed Training (DDP) ###
  ddp:
    enabled: False  # set to true to use multi-GPU
    n_gpus: 2  # how many GPUs / processes per node for torchrun

  # f1, iou, mAP_50, mAP_50_95, mAP_50_mask, mAP_50_95_mask; sem_seg overrides to mIoU
  decision_metrics:
  - f1
  - mAP_50 # will be swapped with mask version for task = segment
  - iou

  img_size: [640, 640] # (h, w)
  in_channels: 3 # 3 = RGB (default). >3 expects .npy stacks (RGB+extras) — see README
  keep_ratio: False # image aspect ratio, if True - image will be padded
  to_visualize_eval: True # save images with gt and preds
  debug_img_processing: True # save images after preprocessing

  amp_enabled: True # use automatic mixed precision
  amp_dtype: bfloat16 # bfloat16/float16
  clip_max_norm: 0.1 # gradient clipping

  batch_size: -1 # physical, should fit on the device. In DDP used per GPU. Auto-pick with -1
  b_accum_steps: 1 # grad accumulation (n * bs)
  epochs: 55
  max_walltime_min: null # research: stop training after N minutes (best epoch kept); null = no cap
  early_stopping: 0 # 0 - no early stopping
  ignore_background_epochs: 0 # background images not used for N epochs in train set. Ignored for sem_seg
  num_workers: 12 # In DDP used per GPU. Go lower if RAM is tight for segmentation
  mask_batch_size: 150 # number of images to process at once when computing mask metrics
  freeze_except_mask: False # freeze everything except MaskDecoder

  ### Validation ###
  conf_thresh: 0.5
  iou_thresh: 0.5

  ### EMA ###
  use_ema: True # use exponential moving average model
  ema_momentum: 0.9998

  ### Optimizer and Scheduler ###
  use_scheduler: True
  use_muon: True # True -> route enc/dec attn+MLP matrices to Muon, rest stays AdamW
  aux_optimizer: adan # adamw|adan: optimizer for non-Muon (aux) groups; ignored if use_muon: False
  adan_lr_mult: 5.0 # adan only: aux-group peak-LR multiplier vs the AdamW aux peak (Adan convention)
  adan_betas: [0.98, 0.92, 0.99] # adan only: exactly 3 betas (b1,b2,b3); AdamW uses train.betas
  base_lr: ${train.lrs.${model_name}.base_lr}
  backbone_lr: ${train.lrs.${model_name}.backbone_lr}
  cycler_pct_start: 0.1
  weight_decay: 0.000125
  betas: [0.9, 0.999]
  label_smoothing: 0.0

  ### Augs ###
  mosaic_augs: # all tasks
    # mosaic_prob: null = task default (0.8 det, 0.5 segment/sem_seg)
    # set a number to override, 0 disables
    mosaic_prob: null
    no_mosaic_epochs: 5
    mosaic_scale: [0.5, 1.5]
    degrees: 0.0 # not recommended if bbox precision is critical
    translate: 0.2
    shear: 2.0

  augs:
    rotation_degree: 10 # maximum +- rotation
    rotation_p: 0.05 # probability of the rotation (with above degree)
    multiscale_prob: 0.0 # ignored for sem_seg (box-collate multiscale)
    scale_jitter: null # only for sem_seg:, e.g. [0.75, 1.5]
    rotate_90: 0.05
    left_right_flip: 0.3
    up_down_flip: 0.0
    to_gray: 0.01
    blur: 0.01
    gamma: 0.02
    brightness: 0.02
    noise: 0.01
    coarse_dropout: 0.0

  ### Reproducibility ###
  seed: 42
  cudnn_fixed: False

  ### Recommended learning rates ###
  lrs:
    n:
      backbone_lr: 0.0004
      base_lr: 0.0008
    s:
      backbone_lr: 0.00006  # can setup up to 0.0002
      base_lr: 0.00025  # 0.0004
    m:
      backbone_lr: 0.00002  # 0.000025
      base_lr: 0.00015  # 0.00025
    l:
      backbone_lr: 0.00001 # 0.00000625 - 0.0000125
      base_lr: 0.00016 # 0.000125 - 0.00025
    x:
      backbone_lr: 0.000002  # 0.0000015 - 0.0000025
      base_lr: 0.0002  # 0.0001 - 0.00025


split:
  ignore_negatives: False # only use images with labels
  shuffle: True
  train_split: 0.85
  val_split: 0.15 # test_split = 1 - train_split - val_split


export: # TensorRT must be done on the inference device
  from_pretrained: False # if True - exports pretrained weights, training is not needed
  half: True # tensorrt, openvino
  max_batch_size: 1 # torch, tensorrt, openvino
  dynamic_input: False # applies to onnx and openvino; the tensorrt engine is always built static
  formats: [onnx, tensorrt, openvino, coreml] # null = all; litert paused (litert-torch caps torch<2.13)
  parity: True # after export, print cosine / max-abs-diff of each backend vs torch on one input
  ov_int8_max_drop: 0.02
  trt_int8_workspace_gb: 4
  trt_int8_validate: True


bench:
  formats: # which backends to bench
    - torch
    - tensorrt
    - onnx
    - openvino
    - coreml
    # - litert  # paused: litert-torch caps torch<2.13


infer:
  to_crop: True  # if True - saves crops of detected objects
  to_track: True  # videos only: assign persistent IDs via ByteTrack and write annotated mp4
  paddings: # if int - amount of pixes, if float - percentage of image size
    w: 0.05
    h: 0.05


### service ###
defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

now_dir: &nowdir ${now:%Y-%m-%d}
