name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      # ruff is pinned in pyproject's dev group; keep this version in sync.
      - name: ruff check
        run: uvx ruff@0.15.20 check .
      - name: ruff format --check
        run: uvx ruff@0.15.20 format --check .

  test-fast:
    name: fast CPU suite (Linux, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true

      # tensorrt is Linux-gated and GPU-only; the fast suite never imports it
      # (gpu/slow tests skip on CI), so skip the ~GB+ install. --no-sync below
      # keeps `uv run` from re-adding it.
      - name: Install dependencies
        run: >
          uv sync
          --no-install-package tensorrt
          --no-install-package tensorrt-cu12
          --no-install-package tensorrt-cu12-libs
          --no-install-package tensorrt-cu12-bindings

      - name: Run fast tests (no GPU, no pretrained weights)
        run: uv run --no-sync pytest -q -m "not slow and not gpu"

  core-install:
    name: core wheel install (no extras)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel

      # A plain `pip install dfine-seg` must give a working torch inference + training
      # install with no export backend present. CPU torch keeps the download sane.
      - name: Install the wheel into a bare venv
        run: |
          uv venv --python 3.12 /tmp/core
          uv pip install --python /tmp/core/bin/python --torch-backend=cpu dist/*.whl

      - name: No export backend may be installed
        run: |
          /tmp/core/bin/python - <<'PY'
          import importlib.util as u
          present = [m for m in ("onnx", "onnxruntime", "openvino", "tensorrt",
                                 "coremltools", "nncf", "transformers", "gradio")
                     if u.find_spec(m) is not None]
          assert not present, f"core install pulled export backends: {present}"
          PY

      - name: Importing the package stays torch-only
        run: |
          /tmp/core/bin/python - <<'PY'
          import sys
          import dfine_seg
          from dfine_seg import load_model, read_image  # noqa: F401
          heavy = [m for m in ("onnx", "onnxruntime", "openvino", "tensorrt", "coremltools",
                               "transformers", "gradio", "hydra", "wandb", "albumentations",
                               "matplotlib", "pandas", "sklearn", "torchmetrics")
                   if m in sys.modules]
          assert not heavy, f"import dfine_seg pulled: {heavy}"
          print("dfine_seg", dfine_seg.__version__)
          PY

      - name: CLI works from a clean directory
        run: |
          mkdir -p /tmp/userdir && cd /tmp/userdir
          /tmp/core/bin/dfine version
          # commands must refuse to run before `init`
          if /tmp/core/bin/dfine train; then echo "expected failure"; exit 1; fi
          /tmp/core/bin/dfine init --task segment --model m
          /tmp/core/bin/python -c "
          import yaml; c = yaml.safe_load(open('config.yaml'))
          assert c['task'] == 'segment' and c['model_name'] == 'm', c
          # a mask task must not be initialized from the detection checkpoint
          assert c['train']['pretrained_model_path'].startswith('pretrained/dfine_seg_'), c
          print('init config OK')"

      # The end of the pip user's first five minutes: weights download, model runs,
      # annotated output is written. Imports alone would not have caught the class-count
      # and task-forwarding bugs that made every non-.pt backend raise TypeError.
      - name: Predict end-to-end from the core install
        run: |
          cd /tmp/userdir
          /tmp/core/bin/dfine predict n "$GITHUB_WORKSPACE/tests/assets/park_gen.jpg" -o out/
          test -f out/park_gen.jpg

  sdist-install:
    name: sdist install (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Build sdist
        run: uv build --sdist

      # The sdist must not carry the dev machine's config.yaml - absolute paths and a
      # private class map. `dfine init` emits the sanitized packaged template instead.
      - name: sdist carries no root config.yaml
        run: |
          tar -tzf dist/*.tar.gz | tee /tmp/files.txt
          if grep -qE "^dfine_seg-[^/]+/config\.yaml$" /tmp/files.txt; then
            echo "sdist ships the dev config.yaml"; exit 1
          fi
          grep -q "dfine_seg/config/default.yaml" /tmp/files.txt

      - name: Install from the sdist and predict
        run: |
          uv venv --python 3.11 /tmp/sd
          uv pip install --python /tmp/sd/bin/python --torch-backend=cpu dist/*.tar.gz
          mkdir -p /tmp/sddir && cd /tmp/sddir
          /tmp/sd/bin/dfine predict n "$GITHUB_WORKSPACE/tests/assets/park_gen.jpg"
