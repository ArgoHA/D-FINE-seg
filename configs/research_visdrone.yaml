# Research preset for the autoresearch loop (VisDrone, detect).
# Single source of truth for what every experiment run holds constant.
# NOT a drop-in config.yaml: scripts/run_candidate.py reads this file, turns
# `overrides` into Hydra dotlist args (key=value) and applies `harness` itself.
# Edit here only — never duplicate these values into scripts.

# Hydra overrides applied to every train/export/bench invocation.
overrides:
  model_name: s
  task: detect
  project_name: visdrone_research

  # Fair init policy: ImageNet stage1 backbone (constant), random neck/head.
  # No COCO-detection weights — they bias toward the original architecture.
  train.imagenet_backbone: true
  train.pretrained_model_path: null

  # Walltime governs which epoch we stop at, but epochs still sets the LR
  # schedule's horizon. Keep at 100 (NOT 1000): at 1000 the warmup/decay is
  # stretched so far that the ~20-25 epochs that actually run under the 60-min
  # cap never leave early warmup -> LR too low -> starved convergence. 100 makes
  # the schedule well-matched to the real training length. Do not change.
  train.max_walltime_min: 60
  train.epochs: 100

  # Pinned (not auto -1): VisDrone batches are object-dense, so auto_batch_size's
  # VRAM probe under-estimates true peak and OOMs mid-run. Fixed = deterministic
  # across seeds + headroom for dense-batch spikes on a 16 GB card.
  train.batch_size: 8

  train.use_wandb: false

  # Muon (Jordan et al., 2024): Newton-Schulz-orthogonalized momentum for the enc/dec
  # attention/MLP matrices (det/mask heads, backbone, norms/biases stay on AdamW). Targets
  # per-step optimization efficiency — the real bottleneck under the walltime cap. Train-only,
  # zero inference latency. Muon peak LR = base_lr*10 (set in train.py).
  train.use_muon: true

  # Build/bench only what we need: torch (from model.pt) + TensorRT.
  # onnx is auto-built as the TRT dependency.
  export.formats: [tensorrt]
  bench.formats: [torch, tensorrt]

# Read by scripts/run_candidate.py (not passed to Hydra).
harness:
  seeds: [42, 123]   # 2-seed screen (was 3); floor-0.003 margin governs, not seed-count std. If the
                     # two seeds disagree by > margin, add a 3rd by hand. See EXPERIMENT_GUIDE §seeds.
  eval_split: test      # split used for the decision: f1 (bench) + mAP_50_95 (train) both on test
